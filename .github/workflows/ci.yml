name: Pure TUI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_incident_package:
        description: Run the costly five-platform, 100-replay incident package gate
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.11'
  RUST_TOOLCHAIN: '1.92.0'
  CRABCODE_RELEASE_BUILD: '1'
  CRABCODE_BUILD_MINIFY: '1'
  ACCOUNT_BRIDGE_ELIGIBILITY_PUBLIC_KEY_BASE64URL: loXs2jEP4Spq1FRzy0dnU6qm9o6eELAuhJ7AdNw1SVE
  ACCOUNT_BRIDGE_CONNECTOR_POLICY_PUBLIC_KEY_BASE64URL: 1rLNPsLwBefJ_7pKyv-49onlWjUZlGn6TPDnI21QcIg
  ACCOUNT_BRIDGE_ARTIFACT_PUBLIC_KEY_BASE64URL: 15MaLfvECwoagY8Oehclhk5nqsngGq0ECrKkRwOxDAQ
  ACCOUNT_BRIDGE_CONTROL_PLANE_ENDPOINT: https://acosmi.com/api/v4/account-bridge/control-plane/v2

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run smoke:tui

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install Linux sandbox build dependency
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libseccomp-dev pkg-config
      - run: cargo test --locked --manifest-path crates/Cargo.toml --workspace
      - run: cargo test --locked --manifest-path libs/acosmi-memory/Cargo.toml --workspace
      - run: cargo test --locked --manifest-path libs/acosmi-se/Cargo.toml --workspace

  account-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: components/oauthapi-llm/go.mod
          cache-dependency-path: components/oauthapi-llm/go.sum
      - run: go test -C components/oauthapi-llm ./...

  incident-package:
    name: Incident package replay ${{ matrix.platform }}
    if: github.event_name == 'workflow_dispatch' && inputs.run_incident_package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64-darwin
            runner: macos-15
          - platform: x64-darwin
            runner: macos-15-intel
          - platform: arm64-linux
            runner: ubuntu-24.04-arm
          - platform: x64-linux
            runner: ubuntu-24.04
          - platform: x64-win32
            runner: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            libs/acosmi-memory

      - name: Install Linux sandbox build dependency
        if: contains(matrix.platform, 'linux')
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libseccomp-dev pkg-config

      - name: Install exact JavaScript dependency graph
        run: bun install --frozen-lockfile

      - name: Bind an unpublished CI package identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            test "$(git rev-list -n 1 "refs/tags/${TAG}")" = "$(git rev-parse HEAD)" || {
              echo "::error::${TAG} already identifies another commit; bump the source version"; exit 1;
            }
          else
            git tag "${TAG}"
          fi
          {
            echo "VERSION=${VERSION}"
            echo "CRABCODE_BUILD_ID=${VERSION}+$(git rev-parse --short=12 HEAD)"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
          } >> "${GITHUB_ENV}"

      - name: Build the closed product runtime
        run: bun run build:ts

      - name: Enforce complete source and executable boundary
        run: node scripts/repository-boundary.mjs

      - name: Build native product closure
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path crates/Cargo.toml \
            -p crabcode-cli --bin crabcode-pure-tui-launcher
          cargo build --locked --release --manifest-path crates/Cargo.toml \
            -p crabcode-tui --bin crabcode-tui
          cargo build --locked --release --manifest-path crates/Cargo.toml \
            -p crabcode-cron --bin crabcode-cron
          cargo build --locked --release --manifest-path libs/acosmi-memory/Cargo.toml \
            --bin acosmi-memory-orchestrator

      - name: Assemble the exact native package
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/assemble-release.mjs \
            --platform '${{ matrix.platform }}' \
            --version "${VERSION}" \
            --output-dir dist/incident-release

      - name: Run 100 isolated incident replays
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.platform }}' in
            x64-win32)
              ASSET="dist/incident-release/crabcode-${VERSION}-${{ matrix.platform }}.zip"
              INSTALLER='scripts/install.ps1'
              ;;
            *)
              ASSET="dist/incident-release/crabcode-${VERSION}-${{ matrix.platform }}.tar.gz"
              INSTALLER='scripts/install.sh'
              ;;
          esac
          bun scripts/release-package-smoke.mjs \
            --archive "${ASSET}" \
            --installer "${INSTALLER}" \
            --iterations 100
