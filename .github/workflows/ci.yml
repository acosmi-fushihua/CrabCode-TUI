name: Pure TUI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run smoke:tui

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - run: cargo test --locked --manifest-path crates/Cargo.toml --workspace
      - run: cargo test --locked --manifest-path libs/acosmi-memory/Cargo.toml --workspace
      - run: cargo test --locked --manifest-path libs/acosmi-se/Cargo.toml --workspace

  account-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: components/oauthapi-llm/go.mod
      - run: go test -C components/oauthapi-llm ./...
