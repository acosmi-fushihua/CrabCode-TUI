name: Pure TUI Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable signed release tag whose Windows package is being recovered
        required: true
        type: string
      expected_windows_sha256:
        description: SHA-256 of the byte-identical Windows package that already passed the repeated incident gate
        required: true
        type: string
      evidence_run_id:
        description: Failed canonical release run containing the completed 100/100 replay evidence
        required: true
        type: string
      recovery_strategy:
        description: Reuse exact bytes when available, or rebuild the same signed source with deterministic Windows linking
        required: true
        default: exact-bytes
        type: choice
        options:
          - exact-bytes
          - deterministic-rebuild

permissions:
  actions: read
  contents: read

concurrency:
  group: pure-tui-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.14'
  RUST_TOOLCHAIN: '1.92.0'
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RELEASE_TOOLING_SHA: ${{ github.sha }}
  EXPECTED_WINDOWS_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_windows_sha256 || '' }}
  EVIDENCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence_run_id || '' }}
  RECOVERY_STRATEGY: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_strategy || 'tag-release' }}
  CRABCODE_RELEASE_BUILD: '1'
  CRABCODE_BUILD_MINIFY: '1'
  ACCOUNT_BRIDGE_ELIGIBILITY_PUBLIC_KEY_BASE64URL: loXs2jEP4Spq1FRzy0dnU6qm9o6eELAuhJ7AdNw1SVE
  ACCOUNT_BRIDGE_CONNECTOR_POLICY_PUBLIC_KEY_BASE64URL: 1rLNPsLwBefJ_7pKyv-49onlWjUZlGn6TPDnI21QcIg
  ACCOUNT_BRIDGE_ARTIFACT_PUBLIC_KEY_BASE64URL: 15MaLfvECwoagY8Oehclhk5nqsngGq0ECrKkRwOxDAQ
  ACCOUNT_BRIDGE_CONTROL_PLANE_ENDPOINT: https://acosmi.com/api/v4/account-bridge/control-plane/v2

jobs:
  verify-source:
    name: Verify tagged pure-TUI source
    if: github.repository == 'acosmi/CrabCode-TUI'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.identity.outputs.version }}
      build_id: ${{ steps.identity.outputs.build_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify the authorized signed annotated tag
        shell: bash
        env:
          RELEASE_TAG_SIGNER_SSH_ED25519: ${{ vars.RELEASE_TAG_SIGNER_SSH_ED25519 }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          test "$(git cat-file -t "refs/tags/${TAG}")" = 'tag' || {
            echo "::error::release tag must be an annotated tag"; exit 1;
          }
          [[ "${RELEASE_TAG_SIGNER_SSH_ED25519}" =~ ^ssh-ed25519[[:space:]][A-Za-z0-9+/=]+$ ]] || {
            echo "::error::protected RELEASE_TAG_SIGNER_SSH_ED25519 is missing or invalid"; exit 1;
          }
          test "$(git for-each-ref "refs/tags/${TAG}" --format='%(taggeremail)')" = '<crabcode-release@acosmi.com>' || {
            echo "::error::release tagger must be crabcode-release@acosmi.com"; exit 1;
          }
          ALLOWED_SIGNERS="${RUNNER_TEMP}/release-tag-signers"
          printf 'crabcode-release@acosmi.com %s\n' "${RELEASE_TAG_SIGNER_SSH_ED25519}" > "${ALLOWED_SIGNERS}"
          chmod 0600 "${ALLOWED_SIGNERS}"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "${ALLOWED_SIGNERS}"
          git verify-tag "${TAG}"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install exact JavaScript dependency graph
        run: bun install --frozen-lockfile

      - name: Verify signed Account Bridge inputs before native allocation
        run: bun scripts/verify-release-account-bridge.mjs

      - name: Bind tag, version, commit, and changelog
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
            echo "::error::release tag is not canonical vSemVer: ${TAG}"; exit 1;
          }
          VERSION="${TAG#v}"
          SOURCE_VERSION="$(node -p "require('./package.json').version")"
          test "${VERSION}" = "${SOURCE_VERSION}" || {
            echo "::error::tag ${TAG} does not match package.json ${SOURCE_VERSION}"; exit 1;
          }
          git show-ref --verify --quiet "refs/tags/${TAG}"
          test "$(git rev-list -n 1 "refs/tags/${TAG}")" = "$(git rev-parse HEAD)" || {
            echo "::error::checked-out commit is not ${TAG}"; exit 1;
          }
          grep -qE "^##[[:space:]]+v${VERSION//./\.}([[:space:]]|$)" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no v${VERSION} section"; exit 1;
          }
          BUILD_ID="${VERSION}+$(git rev-parse --short=12 HEAD)"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "build_id=${BUILD_ID}" >> "${GITHUB_OUTPUT}"

      - name: Validate bounded Windows recovery inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXPECTED_WINDOWS_SHA256}" =~ ^[a-f0-9]{64}$ ]] || {
            echo "::error::expected Windows SHA-256 must be 64 lowercase hexadecimal characters"; exit 1;
          }
          [[ "${EVIDENCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::evidence run id must be a positive decimal integer"; exit 1;
          }
          case "${RECOVERY_STRATEGY}" in
            exact-bytes|deterministic-rebuild) ;;
            *) echo "::error::unsupported Windows recovery strategy: ${RECOVERY_STRATEGY}"; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" || {
            echo "::error::Windows recovery must remain bound to the immutable signed tag"; exit 1;
          }

      - name: Verify the prior byte-identical 100-replay evidence
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN="repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}"
          test "$(gh api "${RUN}" --jq .event)" = 'push'
          test "$(gh api "${RUN}" --jq .path)" = '.github/workflows/release.yml'
          test "$(gh api "${RUN}" --jq .head_branch)" = "${RELEASE_TAG}"
          test "$(gh api "${RUN}" --jq .head_sha)" = "$(git rev-parse HEAD)"
          test "$(gh api "${RUN}" --jq .conclusion)" = 'failure'
          LOG="${RUNNER_TEMP}/windows-recovery-evidence.log"
          gh run view "${EVIDENCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --log > "${LOG}"
          HASH_MATCHES="$(grep -F -c "\"sha256\": \"${EXPECTED_WINDOWS_SHA256}\"" "${LOG}")"
          test "${HASH_MATCHES}" -ge 2 || {
            echo "::error::evidence run does not contain two byte-identical assembly hashes"; exit 1;
          }
          grep -Fq 'release package smoke iteration complete: 100/100' "${LOG}" || {
            echo "::error::evidence run did not complete 100/100 package replays"; exit 1;
          }
          grep -Fq 'release package smoke phase: installer launcher-start' "${LOG}" || {
            echo "::error::evidence run did not enter the subsequent installer gate"; exit 1;
          }

      - name: Assert installer encodings
        shell: bash
        run: |
          set -euo pipefail
          test "$(head -c 3 scripts/install.ps1 | od -An -tx1 | tr -d ' \n')" = 'efbbbf'
          test "$(head -c 3 scripts/install.sh | od -An -tx1 | tr -d ' \n')" != 'efbbbf'
          sh -n scripts/install.sh

      - name: Enforce tagged source boundary
        run: node scripts/repository-boundary.mjs --source-only

  # macOS arm64 and x64 archives are assembled, replayed, signed, and uploaded
  # from the audited local Apple Silicon release host. Keeping the sole hosted
  # native allocation on Windows avoids duplicate macOS runner consumption.
  # After this job succeeds, its attested ZIP is downloaded and appended to the
  # already-public mutable release together with install.ps1 and fresh checksums.
  # A manual recovery remains bound to the prior 100/100 evidence and immutable
  # signed source. Exact-byte recovery additionally binds the ZIP digest. When
  # the original runner did not preserve its ZIP, deterministic-rebuild removes
  # PE linker timestamps and performs installer-first plus one direct replay.
  build-windows:
    name: Build and verify x64-win32
    needs: verify-source
    if: github.repository == 'acosmi/CrabCode-TUI'
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      # MSVC link.exe otherwise writes per-link PE timestamps. /Brepro makes
      # executable linking deterministic across equivalent hosted runners.
      # Cargo reads the encoded form directly, so Git Bash cannot reinterpret
      # /Brepro as an MSYS path before rustc passes it to link.exe.
      CARGO_ENCODED_RUSTFLAGS: -Clink-arg=/Brepro
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Prove deterministic Windows PE linking before native allocation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $probeDirectory = Join-Path $env:RUNNER_TEMP 'crabcode-linker-probe'
          $source = Join-Path $probeDirectory 'main.rs'
          $output = Join-Path $probeDirectory 'probe.exe'
          $baseline = Join-Path $probeDirectory 'baseline.exe'
          [void][System.IO.Directory]::CreateDirectory($probeDirectory)
          [System.IO.File]::WriteAllText(
            $source,
            "fn main() {}`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          & rustc $source '-C' 'debuginfo=0' '-C' 'strip=symbols' '-C' 'link-arg=/Brepro' '-o' $output
          if ($LASTEXITCODE -ne 0) { throw "first deterministic PE probe link failed: $LASTEXITCODE" }
          Copy-Item -LiteralPath $output -Destination $baseline -Force
          Start-Sleep -Seconds 2
          & rustc $source '-C' 'debuginfo=0' '-C' 'strip=symbols' '-C' 'link-arg=/Brepro' '-o' $output
          if ($LASTEXITCODE -ne 0) { throw "second deterministic PE probe link failed: $LASTEXITCODE" }
          $baselineHash = (Get-FileHash -LiteralPath $baseline -Algorithm SHA256).Hash
          $outputHash = (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash
          if ($baselineHash -cne $outputHash) {
            throw "MSVC /Brepro did not produce a byte-identical PE probe: $baselineHash != $outputHash"
          }

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            crates
            libs/acosmi-memory

      - name: Install exact JavaScript dependency graph
        run: bun install --frozen-lockfile

      - name: Parse the public PowerShell installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [void][scriptblock]::Create(
            [System.IO.File]::ReadAllText((Resolve-Path 'scripts/install.ps1'))
          )

      - name: Prove native launcher observation survives until explicit finalization
        run: bun test tests/unit/release-package-process-runner.test.ts

      - name: Establish cross-language build identity
        shell: bash
        run: |
          set -euo pipefail
          echo "CRABCODE_BUILD_ID=${{ needs.verify-source.outputs.build_id }}" >> "${GITHUB_ENV}"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"

      - name: Build closed TypeScript business runtime
        run: bun run build:ts

      - name: Enforce complete source and executable boundary
        run: node scripts/repository-boundary.mjs

      - name: Build native Rust TUI product closure
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path crates/Cargo.toml \
            -p crabcode-cli --bin crabcode-pure-tui-launcher
          cargo build --locked --release --manifest-path crates/Cargo.toml \
            -p crabcode-tui --bin crabcode-tui
          cargo build --locked --release --manifest-path crates/Cargo.toml \
            -p crabcode-cron --bin crabcode-cron
          cargo build --locked --release --manifest-path libs/acosmi-memory/Cargo.toml \
            --bin acosmi-memory-orchestrator

      - name: Assemble and verify one compiled product closure
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.verify-source.outputs.version }}'
          PLATFORM='x64-win32'
          bun scripts/assemble-release.mjs \
            --platform "${PLATFORM}" \
            --version "${VERSION}" \
            --output-dir dist/release
          case "${PLATFORM}" in
            x64-win32) ASSET="dist/release/crabcode-${VERSION}-${PLATFORM}.zip" ;;
            *) ASSET="dist/release/crabcode-${VERSION}-${PLATFORM}.tar.gz" ;;
          esac
          BASELINE='dist/release/.reproducibility-baseline'
          cp "${ASSET}" "${BASELINE}"
          bun scripts/assemble-release.mjs \
            --platform "${PLATFORM}" \
            --version "${VERSION}" \
            --output-dir dist/release
          cmp -s "${BASELINE}" "${ASSET}" || {
            echo "::error::repeated assembly from one compiled closure is not byte-for-byte reproducible"; exit 1;
          }
          rm -f "${BASELINE}"

      - name: Verify package archive shape
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.verify-source.outputs.version }}'
          ASSET="dist/release/crabcode-${VERSION}-x64-win32.zip"
          test -s "${ASSET}"
          test "$(find dist/release -maxdepth 1 -type f -name 'crabcode-*' | wc -l | tr -d ' ')" = '1'

      # Preserve the candidate before every smoke or evidence assertion. A later
      # harness failure can then be diagnosed without another 25-minute build.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-x64-win32
          path: dist/release/crabcode-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Bind exact-byte recovery to the previously replayed package
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_strategy == 'exact-bytes'
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.verify-source.outputs.version }}'
          ASSET="dist/release/crabcode-${VERSION}-x64-win32.zip"
          ACTUAL="$(sha256sum "${ASSET}" | awk '{print $1}')"
          test "${ACTUAL}" = "${EXPECTED_WINDOWS_SHA256}" || {
            echo "::error::recovery package differs from the bytes already replayed 100 times: expected ${EXPECTED_WINDOWS_SHA256}, got ${ACTUAL}"; exit 1;
          }

      - name: Replay the incident 100 times from the assembled package
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.verify-source.outputs.version }}'
          ASSET="dist/release/crabcode-${VERSION}-x64-win32.zip"
          bun scripts/release-package-smoke.mjs \
            --archive "${ASSET}" \
            --installer scripts/install.ps1 \
            --iterations 100

      - name: Load the audited recovery harness from the workflow commit
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${RELEASE_TOOLING_SHA}^{commit}"
          git merge-base --is-ancestor "${RELEASE_TOOLING_SHA}" origin/main || {
            echo "::error::recovery tooling commit is not on enterprise main"; exit 1;
          }
          git restore --source="${RELEASE_TOOLING_SHA}" -- scripts/release-package-smoke.mjs
          git diff --quiet "${RELEASE_TOOLING_SHA}" -- scripts/release-package-smoke.mjs || {
            echo "::error::failed to bind the recovery harness to the workflow commit"; exit 1;
          }

      - name: Complete installer-first recovery and one direct confirmation replay
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.verify-source.outputs.version }}'
          ASSET="dist/release/crabcode-${VERSION}-x64-win32.zip"
          bun scripts/release-package-smoke.mjs \
            --archive "${ASSET}" \
            --installer scripts/install.ps1 \
            --iterations 1

      - name: Generate Windows build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/release/crabcode-*.zip
