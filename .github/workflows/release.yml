name: Pure TUI Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: pure-tui-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.11'
  RUST_TOOLCHAIN: '1.92.0'
  RELEASE_TAG: ${{ github.ref_name }}
  CRABCODE_RELEASE_BUILD: '1'
  CRABCODE_BUILD_MINIFY: '1'
  ACCOUNT_BRIDGE_ELIGIBILITY_PUBLIC_KEY_BASE64URL: loXs2jEP4Spq1FRzy0dnU6qm9o6eELAuhJ7AdNw1SVE
  ACCOUNT_BRIDGE_CONNECTOR_POLICY_PUBLIC_KEY_BASE64URL: 1rLNPsLwBefJ_7pKyv-49onlWjUZlGn6TPDnI21QcIg
  ACCOUNT_BRIDGE_ARTIFACT_PUBLIC_KEY_BASE64URL: NDtaDCEQQYvWQyxnaJuFCuEvG5lBMFtBKwQxdZwXBCE
  ACCOUNT_BRIDGE_CONTROL_PLANE_ENDPOINT: https://acosmi.com/api/v4/account-bridge/control-plane/v2

jobs:
  verify-source:
    name: Verify tagged pure-TUI source
    if: github.repository == 'acosmi/CrabCode-TUI'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      build_id: ${{ steps.identity.outputs.build_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify the authorized signed annotated tag
        shell: bash
        env:
          RELEASE_TAG_SIGNER_SSH_ED25519: ${{ vars.RELEASE_TAG_SIGNER_SSH_ED25519 }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          test "$(git cat-file -t "refs/tags/${TAG}")" = 'tag' || {
            echo "::error::release tag must be an annotated tag"; exit 1;
          }
          [[ "${RELEASE_TAG_SIGNER_SSH_ED25519}" =~ ^ssh-ed25519[[:space:]][A-Za-z0-9+/=]+$ ]] || {
            echo "::error::protected RELEASE_TAG_SIGNER_SSH_ED25519 is missing or invalid"; exit 1;
          }
          test "$(git for-each-ref "refs/tags/${TAG}" --format='%(taggeremail)')" = '<crabcode-release@acosmi.com>' || {
            echo "::error::release tagger must be crabcode-release@acosmi.com"; exit 1;
          }
          ALLOWED_SIGNERS="${RUNNER_TEMP}/release-tag-signers"
          printf 'crabcode-release@acosmi.com %s\n' "${RELEASE_TAG_SIGNER_SSH_ED25519}" > "${ALLOWED_SIGNERS}"
          chmod 0600 "${ALLOWED_SIGNERS}"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "${ALLOWED_SIGNERS}"
          git verify-tag "${TAG}"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Bind tag, version, commit, and changelog
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
            echo "::error::release tag is not canonical vSemVer: ${TAG}"; exit 1;
          }
          VERSION="${TAG#v}"
          SOURCE_VERSION="$(node -p "require('./package.json').version")"
          test "${VERSION}" = "${SOURCE_VERSION}" || {
            echo "::error::tag ${TAG} does not match package.json ${SOURCE_VERSION}"; exit 1;
          }
          git show-ref --verify --quiet "refs/tags/${TAG}"
          test "$(git rev-list -n 1 "refs/tags/${TAG}")" = "$(git rev-parse HEAD)" || {
            echo "::error::checked-out commit is not ${TAG}"; exit 1;
          }
          grep -qE "^##[[:space:]]+v${VERSION//./\.}([[:space:]]|$)" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no v${VERSION} section"; exit 1;
          }
          BUILD_ID="${VERSION}+$(git rev-parse --short=12 HEAD)"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "build_id=${BUILD_ID}" >> "${GITHUB_OUTPUT}"

      - name: Assert installer encodings
        shell: bash
        run: |
          set -euo pipefail
          test "$(head -c 3 scripts/install.ps1 | od -An -tx1 | tr -d ' \n')" = 'efbbbf'
          test "$(head -c 3 scripts/install.sh | od -An -tx1 | tr -d ' \n')" != 'efbbbf'
          sh -n scripts/install.sh

      - name: Enforce tagged source boundary
        run: node scripts/repository-boundary.mjs --source-only

  x64-darwin-runtime-preflight:
    name: Preflight complete runtime on native Intel macOS
    needs: verify-source
    if: github.repository == 'acosmi/CrabCode-TUI'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install exact JavaScript dependency graph
        run: bun install --frozen-lockfile

      - name: Enforce the complete command lifecycle evidence
        run: bun run check:tui-command-capabilities

      - name: Exercise terminal ownership, signals, and restoration
        run: cargo test --locked --manifest-path crates/Cargo.toml -p crabcode-tui --features terminal-lifecycle-tests --test terminal_lifecycle

      - name: Establish cross-language build identity
        shell: bash
        run: |
          set -euo pipefail
          echo "CRABCODE_BUILD_ID=${{ needs.verify-source.outputs.build_id }}" >> "${GITHUB_ENV}"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"

      - name: Build closed TypeScript business runtime
        run: bun run build:ts

      - name: Enforce complete source and executable boundary
        run: node scripts/repository-boundary.mjs

      - name: Exercise the pinned runtime before allocating the build matrix
        run: bun scripts/release-x64-darwin-runtime-preflight.mjs --iterations 10

  x64-win32-process-observer-preflight:
    name: Preflight retained package observation on Windows
    needs: verify-source
    if: github.repository == 'acosmi/CrabCode-TUI'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install exact JavaScript dependency graph
        run: bun install --frozen-lockfile

      - name: Prove native launcher observation survives until explicit finalization
        run: bun test tests/unit/release-package-process-runner.test.ts

  build:
    name: Build ${{ matrix.platform }}
    needs:
      - verify-source
      - x64-darwin-runtime-preflight
      - x64-win32-process-observer-preflight
    if: github.repository == 'acosmi/CrabCode-TUI'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: arm64-darwin
            runner: macos-15
            timeoutMinutes: 120
          - platform: x64-darwin
            runner: macos-15-intel
            timeoutMinutes: 120
          - platform: x64-win32
            runner: windows-2025
            timeoutMinutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            crates
            libs/acosmi-memory

      - name: Install exact JavaScript dependency graph
        run: bun install --frozen-lockfile

      - name: Parse the public PowerShell installer on Windows
        if: matrix.platform == 'x64-win32'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [void][scriptblock]::Create(
            [System.IO.File]::ReadAllText((Resolve-Path 'scripts/install.ps1'))
          )

      - name: Establish cross-language build identity
        shell: bash
        run: |
          set -euo pipefail
          echo "CRABCODE_BUILD_ID=${{ needs.verify-source.outputs.build_id }}" >> "${GITHUB_ENV}"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"

      - name: Build closed TypeScript business runtime
        run: bun run build:ts

      - name: Enforce complete source and executable boundary
        run: node scripts/repository-boundary.mjs

      - name: Build native Rust TUI product closure
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path crates/Cargo.toml \
            -p crabcode-cli --bin crabcode-pure-tui-launcher
          cargo build --locked --release --manifest-path crates/Cargo.toml \
            -p crabcode-tui --bin crabcode-tui
          cargo build --locked --release --manifest-path crates/Cargo.toml \
            -p crabcode-cron --bin crabcode-cron
          cargo build --locked --release --manifest-path libs/acosmi-memory/Cargo.toml \
            --bin acosmi-memory-orchestrator

      - name: Assemble and verify one compiled product closure
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.verify-source.outputs.version }}'
          PLATFORM='${{ matrix.platform }}'
          bun scripts/assemble-release.mjs \
            --platform "${PLATFORM}" \
            --version "${VERSION}" \
            --output-dir dist/release
          case "${PLATFORM}" in
            x64-win32) ASSET="dist/release/crabcode-${VERSION}-${PLATFORM}.zip" ;;
            *) ASSET="dist/release/crabcode-${VERSION}-${PLATFORM}.tar.gz" ;;
          esac
          BASELINE='dist/release/.reproducibility-baseline'
          cp "${ASSET}" "${BASELINE}"
          bun scripts/assemble-release.mjs \
            --platform "${PLATFORM}" \
            --version "${VERSION}" \
            --output-dir dist/release
          cmp -s "${BASELINE}" "${ASSET}" || {
            echo "::error::repeated assembly from one compiled closure is not byte-for-byte reproducible"; exit 1;
          }
          rm -f "${BASELINE}"

      - name: Verify package archive shape
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.verify-source.outputs.version }}'
          case '${{ matrix.platform }}' in
            x64-win32) ASSET="dist/release/crabcode-${VERSION}-${{ matrix.platform }}.zip" ;;
            *) ASSET="dist/release/crabcode-${VERSION}-${{ matrix.platform }}.tar.gz" ;;
          esac
          test -s "${ASSET}"
          test "$(find dist/release -maxdepth 1 -type f -name 'crabcode-*' | wc -l | tr -d ' ')" = '1'

      - name: Replay the incident 100 times from the assembled package
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.verify-source.outputs.version }}'
          case '${{ matrix.platform }}' in
            x64-win32)
              ASSET="dist/release/crabcode-${VERSION}-${{ matrix.platform }}.zip"
              INSTALLER='scripts/install.ps1'
              ;;
            *)
              ASSET="dist/release/crabcode-${VERSION}-${{ matrix.platform }}.tar.gz"
              INSTALLER='scripts/install.sh'
              ;;
          esac
          bun scripts/release-package-smoke.mjs \
            --archive "${ASSET}" \
            --installer "${INSTALLER}" \
            --iterations 100

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/release/crabcode-*.tar.gz
            dist/release/crabcode-*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish immutable GitHub Release
    needs: [verify-source, build]
    if: github.repository == 'acosmi/CrabCode-TUI'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Assemble exact public asset set
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.verify-source.outputs.version }}'
          for name in \
            "crabcode-${VERSION}-arm64-darwin.tar.gz" \
            "crabcode-${VERSION}-x64-darwin.tar.gz" \
            "crabcode-${VERSION}-x64-win32.zip"; do
            test -s "release-assets/${name}" || { echo "::error::missing ${name}"; exit 1; }
          done
          cp scripts/install.sh scripts/install.ps1 release-assets/
          chmod 0755 release-assets/install.sh
          (
            cd release-assets
            sha256sum \
              "crabcode-${VERSION}-arm64-darwin.tar.gz" \
              "crabcode-${VERSION}-x64-darwin.tar.gz" \
              "crabcode-${VERSION}-x64-win32.zip" \
              install.sh install.ps1 \
              > checksums-sha256.txt
          )
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = '6'

      - name: Generate GitHub build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            release-assets/crabcode-*.tar.gz
            release-assets/crabcode-*.zip
            release-assets/checksums-sha256.txt
            release-assets/install.sh
            release-assets/install.ps1

      - name: Verify all local release attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for asset in release-assets/*; do
            VERIFIED='0'
            for attempt in 1 2 3 4 5 6; do
              echo "attestation check ${attempt}/6 for ${asset}"
              if gh attestation verify "${asset}" \
                --repo "${GITHUB_REPOSITORY}" \
                --source-ref "refs/tags/${RELEASE_TAG}" \
                --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml"; then
                VERIFIED='1'
                break
              fi
              sleep 2
            done
            test "${VERIFIED}" = '1' || {
              echo "::error::attestation verification failed for ${asset}"; exit 1;
            }
          done

      - name: Create immutable draft, verify it, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          VERSION='${{ needs.verify-source.outputs.version }}'
          NOTES="${RUNNER_TEMP}/release-notes.md"
          printf '%s\n' \
            '# CrabCode TUI' \
            '' \
            '纯终端开源发行：Rust 核心底层 + TypeScript 业务运行时 + 隔离的 Go OAuth Account Bridge。' \
            '' \
            '- macOS arm64 与 x64、Windows x64 完整安装包' \
            '- 安装器先校验 Release SHA-256，再校验包内逐文件清单' \
            '- Account Bridge 验证签名来源、平台证据、SBOM 与第三方许可' \
            '- 包含 Bun、ripgrep、crabcode-browser、Sharp/libvips 的固定版本和许可材料' \
            '' \
            '注册赠送 6 个月 GO 订阅会员；邀请好友可获得重置次数；模型与权益以线上服务实际展示为准。' \
            '' \
            'GUI 为独立产品：https://acosmi.com/zh/downloads' \
            '' \
            'Terminal-only open-source release with three native packages for macOS and Windows, fail-closed installers, per-file manifests, signed Account Bridge provenance, dependency licenses, and GitHub build attestation.' \
            > "${NOTES}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::release ${TAG} already exists; immutable assets cannot be overwritten"
            exit 1
          fi
          if [[ "${VERSION}" == *-* ]]; then
            gh release create "${TAG}" release-assets/* \
              --verify-tag --draft --prerelease --title "CrabCode TUI ${VERSION}" --notes-file "${NOTES}"
          else
            gh release create "${TAG}" release-assets/* \
              --verify-tag --draft --title "CrabCode TUI ${VERSION}" --notes-file "${NOTES}"
          fi
          EXPECTED="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          ACTUAL="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets | length')"
          test "${ACTUAL}" = "${EXPECTED}" || {
            echo "::error::release asset count ${ACTUAL} != ${EXPECTED}"; exit 1;
          }
          BAD_DIGESTS=""
          for attempt in 1 2 3 4 5 6; do
            echo "server-side digest check ${attempt}/6"
            BAD_DIGESTS="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
              --jq '.assets[] | select(.digest == null or (.digest | startswith("sha256:") | not)) | .name')"
            [ -z "${BAD_DIGESTS}" ] && break
            sleep 2
          done
          test -z "${BAD_DIGESTS}" || {
            echo "::error::release assets without server-side SHA-256: ${BAD_DIGESTS}"; exit 1;
          }
          while IFS= read -r path; do
            NAME="$(basename "${path}")"
            LOCAL="sha256:$(sha256sum "${path}" | cut -d ' ' -f 1)"
            SERVER="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
              --jq ".assets[] | select(.name == \"${NAME}\") | .digest")"
            test "${SERVER}" = "${LOCAL}" || {
              echo "::error::server digest mismatch for ${NAME}"; exit 1;
            }
          done < <(find release-assets -maxdepth 1 -type f | sort)
          if [[ "${VERSION}" == *-* ]]; then
            gh release edit "${TAG}" --draft=false --prerelease
          else
            gh release edit "${TAG}" --draft=false --latest
          fi
