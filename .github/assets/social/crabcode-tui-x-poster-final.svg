      <circle cx="22" cy="26" r="6" fill="#35d8ff"/>
      <text x="40" y="24" class="sans" fill="#effcff" font-size="19" font-weight="700">DeepSeek 模型免费用</text>
      <text x="40" y="42" class="mono" fill="#65ddf7" font-size="10.5" font-weight="700" letter-spacing="1.25">DEEPSEEK MODELS · FREE</text>
      <text x="590" y="34" text-anchor="end" class="mono" fill="#35d8ff" font-size="22" font-weight="900">¥0</text>
    </g>
    <g transform="translate(874 672)">
      <rect width="4" height="41" rx="2" fill="#ff774f"/>
      <text x="18" y="17" class="sans" fill="#f2f6f7" font-size="17" font-weight="700">更高订阅支持 Kimi-3 · Qwen-3.8</text>
      <text x="18" y="38" class="mono" fill="#93a8b0" font-size="10.5" font-weight="700" letter-spacing="1.1">HIGHER TIERS UNLOCK KIMI-3 + QWEN-3.8</text>
    </g>
    <g transform="translate(874 733)">
      <rect width="4" height="41" rx="2" fill="#35d8ff"/>
      <text x="18" y="17" class="sans" fill="#f2f6f7" font-size="17" font-weight="700">Claude · OpenAI · xAI 订阅账户 OAuth 接入</text>
      <text x="18" y="38" class="mono" fill="#93a8b0" font-size="10.5" font-weight="700" letter-spacing="1.05">CONNECT SUBSCRIPTION ACCOUNTS VIA OAUTH</text>
    </g>
