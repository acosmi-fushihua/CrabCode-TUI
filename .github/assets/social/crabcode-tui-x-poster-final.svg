  <g transform="translate(80 826)">
    <line x2="1440" stroke="#b1ccd5" stroke-opacity=".20"/>
    <text y="34" class="mono" fill="#b7c8ce" font-size="12.5" font-weight="700" letter-spacing="1.35">RUST · TYPESCRIPT · GO · MIT LICENSE</text>
    <text x="1440" y="20" text-anchor="end" class="mono" fill="#87a0aa" font-size="10.5" font-weight="700" letter-spacing="1.4">开源地址 / OPEN SOURCE REPOSITORY</text>
    <text x="1440" y="43" text-anchor="end" class="mono" fill="#46dcfa" font-size="15" font-weight="800" letter-spacing=".6">github.com/acosmi/CrabCode-TUI</text>
  </g>
  <g transform="translate(1420 78)">
    <path d="M0 0h72v72" fill="none" stroke="#35d8ff" stroke-width="2" stroke-opacity=".75"/>
    <path d="M72 0v18M72 0H54" fill="none" stroke="#ff774f" stroke-width="5"/>
  </g>
