# Vendored for CrabCode TUI. See MODIFICATIONS.md for local changes.

[package]
edition = "2021"
rust-version = "1.74.0"
name = "ratatui"
version = "0.29.0"
authors = [
    "Florian Dehau <work@fdehau.com>",
    "The Ratatui Developers",
]
build = false
exclude = [
    "assets/*",
    ".github",
    "Makefile.toml",
    "CONTRIBUTING.md",
    "*.log",
    "tags",
]
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A library that's all about cooking up terminal user interfaces"
homepage = "https://ratatui.rs"
documentation = "https://docs.rs/ratatui/latest/ratatui/"
keywords = [
    "tui",
    "terminal",
    "dashboard",
]
categories = ["command-line-interface"]
license = "MIT"
repository = "https://github.com/ratatui/ratatui"

[lib]
name = "ratatui"
path = "src/lib.rs"
bench = false

[dependencies.bitflags]
version = "2.3"

[dependencies.cassowary]
version = "0.3"

[dependencies.compact_str]
version = "0.8.0"

[dependencies.crossterm]
version = "0.28.1"
optional = true

[dependencies.document-features]
version = "0.2.7"
optional = true

[dependencies.indoc]
version = "2"

[dependencies.instability]
version = "0.3.1"

[dependencies.itertools]
version = "0.13"

[dependencies.lru]
version = "0.16.3"

[dependencies.palette]
version = "0.7.6"
optional = true

[dependencies.paste]
version = "1.0.2"

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.strum]
version = "0.26.3"
features = ["derive"]

[dependencies.termwiz]
version = "0.22.0"
optional = true

[dependencies.time]
version = "0.3.11"
features = ["local-offset"]
optional = true

[dependencies.unicode-segmentation]
version = "1.10"

[dependencies.unicode-truncate]
version = "1"

[dependencies.unicode-width]
version = "=0.2.0"

[features]
all-widgets = ["widget-calendar"]
crossterm = ["dep:crossterm"]
default = [
    "crossterm",
    "underline-color",
]
macros = []
palette = ["dep:palette"]
scrolling-regions = []
serde = [
    "dep:serde",
    "bitflags/serde",
    "compact_str/serde",
]
termion = ["dep:termion"]
termwiz = ["dep:termwiz"]
underline-color = ["dep:crossterm"]
unstable = [
    "unstable-rendered-line-info",
    "unstable-widget-ref",
    "unstable-backend-writer",
]
unstable-backend-writer = []
unstable-rendered-line-info = []
unstable-widget-ref = []
widget-calendar = ["dep:time"]

[target."cfg(not(windows))".dependencies.termion]
version = "4.0.0"
optional = true

[lints.clippy]
as_underscore = "warn"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
deref_by_slicing = "warn"
else_if_without_else = "warn"
empty_line_after_doc_comments = "warn"
equatable_if_let = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
map_err_ignore = "warn"
missing_const_for_fn = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
mixed_read_write_in_expression = "warn"
mod_module_files = "warn"
module_inception = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_ref_mut = "warn"
needless_raw_strings = "warn"
or_fun_call = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
string_lit_chars_any = "warn"
string_slice = "warn"
string_to_string = "warn"
unnecessary_self_imports = "warn"
use_self = "warn"

[lints.clippy.cargo]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.rust]
unsafe_code = "forbid"
mismatched_lifetime_syntaxes = "allow"

# Keep this vendored dependency independently testable even when the repository
# containing it is itself nested under another Cargo workspace.
[workspace]
