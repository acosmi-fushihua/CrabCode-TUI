[package]
name = "acosmi-daemon-launcher"
description = "cron daemon spawn + socket lock + PID 文件管理"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
acosmi-config = { path = "../acosmi-config" }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
# P0-3（W-CRON-RELEASE-REOPEN）：pid_identity 的进程 exe/名称核实（防 PID 复用
# 假活/误杀）。与 acosmi-scheduler 的 start_time 防御同一 workspace 版本。
sysinfo = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# `Win32_Security_Authorization` supplies the SID/SDDL APIs used to restrict
# the cron named pipe to SYSTEM, administrators, and the current user.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
] }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serial_test = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
