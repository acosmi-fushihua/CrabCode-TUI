[package]
name = "crabcode-markdown"
description = "Streaming Markdown renderer for CrabCode terminal presentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false

[dependencies]
anstyle = { workspace = true }
anstyle-lossy = { workspace = true }
anstyle-syntect = { workspace = true }
crabcode-markdown-core = { path = "../crabcode-markdown-core" }
html-escape = { workspace = true }
linkify = { workspace = true }
pulldown-cmark = { workspace = true }
ratatui = { workspace = true }
supports-color = { workspace = true }
syntect = { workspace = true }
textwrap = { workspace = true }
two-face = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[features]
default = []
fuzzing = []

[lints]
workspace = true
