[package]
name = "acosmi-sparse"
version = "0.1.0"
authors = [
    "Andrey Vasnetsov <andrey@vasnetsov.com>",
    "Qdrant Team <info@qdrant.tech>",
]
license = "Apache-2.0"
edition = "2024"

[lints]
workspace = true

[features]
testing = ["common/testing"]

[dependencies]
bitpacking = { workspace = true }
gridstore = { package = "acosmi-gridstore", path = "../acosmi-gridstore" }
bincode = { workspace = true }
common = { package = "acosmi-common", path = "../acosmi-common" }
fs-err = { workspace = true }
half = { workspace = true }
memmap2 = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
ordered-float = { workspace = true }
rand = { workspace = true }
validator = { workspace = true }
itertools = { workspace = true }
parking_lot = { workspace = true }
log = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# dev-deps stripped: dataset crate not vendored — do not run cargo test on this crate directly
fs-err = { workspace = true, features = ["debug"] }
generic-tests = { workspace = true }
indicatif = { workspace = true }
acosmi-sparse = { path = ".", features = ["testing"] }

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
pprof = { workspace = true }

[[bench]]
name = "search"
harness = false
