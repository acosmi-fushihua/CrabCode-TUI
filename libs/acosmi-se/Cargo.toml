[workspace]
resolver = "2"
members = [
    "acosmi-segment",
    "acosmi-common",
    "acosmi-gridstore",
    "acosmi-macros",
    "acosmi-posting-list",
    "acosmi-quantization",
    "acosmi-sparse",
    "acosmi-gpu",
]

[workspace.lints.clippy]
cast_lossless = "warn"
doc_link_with_quotes = "warn"
enum_glob_use = "warn"
explicit_into_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
from_iter_instead_of_collect = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
inefficient_to_string = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
needless_continue = "warn"
needless_raw_string_hashes = "warn"
ptr_as_ptr = "warn"
ref_option_ref = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
unused_self = "warn"
used_underscore_binding = "warn"
match_wildcard_for_single_variants = "warn"
needless_pass_by_ref_mut = "warn"
unused_async = "warn"

[workspace.lints.rust]
# https://blog.rust-lang.org/2024/05/06/check-cfg.html#expecting-custom-cfgs
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[workspace.lints.rustdoc]
private_intra_doc_links = "allow"

[workspace.dependencies]
actix-web-validator = "7.0.0"
actix-web = { version = "4.12.1", features = ["rustls-0_23", "actix-tls"] }
actix-files = "0.6.10"
ahash = { version = "0.8.11", features = ["serde"] }
anyhow = "1.0.101"
async-trait = "0.1.89"
atomicwrites = "0.4.4"
bincode = "1.3.3" # no upgrade because 2.0.x is much slower https://github.com/qdrant/qdrant/pull/6134
bitpacking = "0.9.3"
bytemuck = { version = "1.25.0", features = [
    "derive",
    "extern_crate_alloc",
    "must_cast",
    "transparentwrapper_extra",
] }
bytes = "1.11.1"
cc = "1.2"
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.58", features = ["derive", "env"] }
criterion = "0.8.2"
data-encoding = "2.10.0"
delegate = "0.13.5"
ecow = { version = "0.2.6", features = ["serde"] }
env_logger = "0.11"
fnv = "1.0"
fs-err = { version = "3.3.0", features = ["tokio"] }
fs_extra = "1.3.0"
futures = "0.3.32"
futures-util = "0.3.31"
generic-tests = "0.1.3"
half = { version = "2.7.1", features = [
    "alloc",
    "serde",
    "num-traits",
] }
http = "1.3.1"
humantime = "2.3.0"
indexmap = { version = "2", features = ["serde"] }
url = { version = "2.5.8", features = ["serde"] }
urlencoding = "2.1.3"
indicatif = { version = "0.18.4", features = ["rayon"] }
integer-encoding = "4.1.0"
itertools = "0.14.0"
log = "0.4.29"
memmap2 = "0.9.9"
mockito = "1.7"
nix = { version = "0.31", features = ["fs", "feature"] }
num-traits = "0.2.19"
ordered-float = { version = "5.1.0", features = ["serde", "schemars"] }
rayon = "1.11.0"
parking_lot = { version = "0.12.5", features = ["arc_lock", "deadlock_detection", "serde"] }
ph = "0.8.5"
pprof = { version = "0.15.0", features = ["flamegraph", "prost-codec"] }
proptest = { version = "1.10.0", default-features = false, features = ["std"] }
prost = "0.12.6"
prost-build = { version = "0.12.6", features = ["cleanup-markdown"] }
prost-wkt-types = "0.5"
prost-for-raft = { package = "prost", version = "=0.11.9" } # version of prost used by raft
raft = { version = "0.7.0", features = ["prost-codec"], default-features = false }
rand = "0.9.2"
rand_distr = "0.5.1"
rmp-serde = "~1.3"
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "http2",
    "stream",
    "rustls-tls",
    "blocking",
] }
rstest = { version = "0.26.1", default-features = false }
schemars = { version = "0.8.22", features = [
    "uuid1",
    "preserve_order",
    "chrono",
    "url",
    "indexmap2",
] }
semver = { version = "1.0", features = ["serde"] }
self_cell = "1.2.2"
serde = { version = "~1.0", features = ["derive", "rc"] }
serde_cbor = "0.11.2"
serde_variant = "0.1.3"
serde_with = "3.16.1"
sha2 = "0.10.9"
serde_json = { version = "~1.0", features = ["preserve_order"] }
strum = { version = "0.27.2", features = ["derive"] }
tap = "1.0.1"
tar = "0.4.41"
tempfile = "3.25.0"
tinyvec = { version = "1.10.0", features = ["alloc", "latest_stable_rust"] }
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "io-util", "rt"] }
tonic = { version = "0.11.0", features = ["gzip", "tls"] }
tonic-build = { version = "0.11.0", features = ["prost"] }
tonic-reflection = "0.11.0"
tracing = { version = "0.1", features = ["async-await"] }
uuid = { version = "1.21", features = ["v4", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }
wal = { git = "https://github.com/qdrant/wal.git", rev = "c07fb56ebc8120ebe4e3c602d31ce98f356f4676" }
zerocopy = { version = "0.8.39", features = ["derive"] }
atomic_refcell = "0.1.13"
byteorder = "1.5.0"
thiserror = "2.0.18"
bitvec = "1.0.1"
smallvec = { version = "1.15.1", features = ["write"] }
dashmap = "6.1"
walkdir = "2.5.0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.sha2]
opt-level = 3
