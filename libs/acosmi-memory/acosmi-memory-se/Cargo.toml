[package]
name = "acosmi-memory-se"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Process-in-memory search engine backed by acosmi-segment library"

[dependencies]
# acosmi-se segment engine — process-in-memory search engine
acosmi-segment = { path = "../../acosmi-se/acosmi-segment", default-features = false }
# Shared common utilities from acosmi-se
# "testing" feature enables ResourcePermit::dummy() and ProgressTracker::new_for_test()
# needed for embedded segment optimization without a full resource budget.
acosmi-common = { path = "../../acosmi-se/acosmi-common", features = ["testing"] }
# Reuse existing VectorStore trait
acosmi-memory-session = { path = "../acosmi-memory-session" }
# Phase 1 TS memory markdown adapter
acosmi-memory-adapter = { path = "../acosmi-memory-adapter" }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# UUID for point IDs
uuid = { version = "1", features = ["v4", "v5"] }
# Logging
log = "0.4"
tracing = "0.1"
# Concurrency
parking_lot = "0.12"
# Async
async-trait = "0.1"
tokio = { version = "1", features = ["rt"] }
# Random number generation (for SegmentBuilder)
rand = "0.9"
# Temporary directories (for segment optimization)
tempfile = "3"
# Memory root scanning
walkdir = "2"

[dev-dependencies]
acosmi-memory-core = { path = "../acosmi-memory-core" }
regex = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
unicode-normalization = "0.1"
