[package]
name = "acosmi-memory-parse"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Document parsing types and registry for acosmi-memory"

[lib]
crate-type = ["rlib"]

[dependencies]
acosmi-memory-core = { path = "../acosmi-memory-core" }
acosmi-memory-session = { path = "../acosmi-memory-session" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
